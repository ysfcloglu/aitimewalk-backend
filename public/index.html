<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AITimeWalk — Zaman ve Boyut Portalı</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0806">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AITimeWalk">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3565/3565418.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0a0806;
            --bg-card: #14110e;
            --accent-gold: #c9a84c;
            --accent-gold-dim: #947a32;
            --text-light: #f5f2eb;
            --text-dim: #a39e93;
            --border-color: #2c2519;
            --glass-bg: rgba(20, 17, 14, 0.75);
            --shadow-gold: rgba(201, 168, 76, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Crimson Pro', serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Arka Plan Yıldız Animasyonu */
        #stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle var(--duration, 4s) infinite ease-in-out;
            animation-delay: var(--delay, 0s);
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: var(--max-opacity, 0.7); transform: scale(1.2); }
        }

        /* Uygulama Düzeni */
        .app-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Üst Menü / Navigasyon */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-size: 24px;
            color: var(--accent-gold);
            text-shadow: 0 0 10px var(--shadow-gold);
            animation: pulse 3s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 6px var(--accent-gold)); }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-light);
        }

        h1 span {
            color: var(--accent-gold);
        }

        .control-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-icon {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            color: var(--text-light);
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Playfair Display', serif;
            font-weight: bold;
            font-size: 13px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-icon:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            background: rgba(201, 168, 76, 0.05);
        }

        /* Yatay Kaydırılabilir Dönem Menüsü */
        .era-scroller {
            width: 100%;
            background: rgba(10, 8, 6, 0.6);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 10px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }

        .era-scroller::-webkit-scrollbar {
            display: none;
        }

        .era-row {
            display: inline-flex;
            gap: 10px;
            padding: 0 10px;
        }

        .era-tab {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            color: var(--text-dim);
            cursor: pointer;
            font-family: 'Playfair Display', serif;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .era-tab.active {
            background: rgba(201, 168, 76, 0.12);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            box-shadow: 0 0 15px rgba(201, 168, 76, 0.1);
        }

        /* Ana İçerik Alanı */
        .main-layout {
            display: flex;
            flex: 1;
            height: calc(100vh - 145px);
            min-height: 450px;
        }

        /* Sol Taraf: Chat Paneli */
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            background: rgba(14, 17, 20, 0.2);
            position: relative;
        }

        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Chat Balonları */
        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.system { align-self: flex-start; }
        .message.user { align-self: flex-end; }

        .msg-sender {
            font-family: 'Playfair Display', serif;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .system .msg-sender { color: var(--accent-gold); }
        .user .msg-sender { color: var(--text-dim); text-align: right; }

        .msg-bubble {
            padding: 14px 18px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 15px;
        }

        .system .msg-bubble {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-light);
            border-top-left-radius: 0;
        }

        .user .msg-bubble {
            background: rgba(201, 168, 76, 0.15);
            border: 1px solid rgba(201, 168, 76, 0.3);
            color: var(--text-light);
            border-top-right-radius: 0;
        }

        /* Mesaj Giriş Alanı */
        .chat-input-area {
            padding: 16px 20px;
            background: rgba(10, 8, 6, 0.8);
            border-top: 1px solid var(--border-color);
        }

        .input-wrapper {
            display: flex;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 6px;
            transition: all 0.3s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-gold);
            box-shadow: 0 0 10px var(--shadow-gold);
        }

        .input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-light);
            padding: 10px 14px;
            font-family: 'Crimson Pro', serif;
            font-size: 16px;
        }

        .input-wrapper input::placeholder {
            color: rgba(163, 158, 147, 0.5);
        }

        .btn-send {
            background: var(--accent-gold);
            color: var(--bg-dark);
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        /* Sağ Taraf: Grid Paneli */
        .universe-grid-panel {
            width: 380px;
            border-left: 1px solid var(--border-color);
            background: rgba(20, 17, 14, 0.4);
            display: flex;
            flex-direction: column;
        }

        @media (max-width: 900px) {
            .universe-grid-panel { display: none; }
            .main-layout { height: calc(100vh - 125px); }
        }

        .panel-title {
            padding: 20px;
            font-family: 'Playfair Display', serif;
            font-size: 16px;
            color: var(--accent-gold);
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .grid-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .universe-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .universe-card.active {
            border-color: var(--accent-gold);
            background: rgba(201, 168, 76, 0.04);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .card-name {
            font-family: 'Playfair Display', serif;
            font-size: 15px;
            font-weight: 700;
        }

        .universe-card.active .card-name { color: var(--accent-gold); }

        .card-desc {
            font-size: 13px;
            color: var(--text-dim);
            line-height: 1.4;
        }

        .lock-badge {
            position: absolute;
            top: 0; right: 0;
            background: #4a1515;
            color: #ff9e9e;
            font-size: 9px;
            padding: 2px 8px;
            border-bottom-left-radius: 6px;
            font-family: 'Playfair Display', serif;
            text-transform: uppercase;
            display: none;
        }

        .universe-card.premium .lock-badge { display: block; }
        .universe-card.premium { opacity: 0.75; }
    </style>
</head>
<body>

    <div id="stars-container"></div>

    <div class="app-container">
        <header>
            <div class="logo-area">
                <i class="fa-solid fa-hourglass-half logo-icon"></i>
                <h1 id="app-title">AI<span>TimeWalk</span></h1>
            </div>
            <div class="control-buttons">
                <button class="btn-icon" id="lang-btn" onclick="toggleLanguage()">
                    <i class="fa-solid fa-globe"></i> <span>EN</span>
                </button>
            </div>
        </header>

        <div class="era-scroller">
            <div class="era-row" id="era-row-container"></div>
        </div>

        <div class="main-layout">
            <div class="chat-panel">
                <div class="chat-messages" id="chat-box">
                    <div class="message system">
                        <span class="msg-sender" id="sender-title">ZAMAN REHBERİ</span>
                        <div class="msg-bubble" id="welcome-msg">
                            Zaman ve boyut portalına hoş geldin yolcu. Gitmek istediğin dönemi veya paralel evreni seç, gerisini kuantum yapay zekâ motoruna bırak. Kronoloji kırılmasına hazır mısın?
                        </div>
                    </div>
                </div>

                <div class="chat-input-area">
                    <div class="input-wrapper">
                        <input type="text" id="user-input" placeholder="Zaman çizgisini değiştirecek bir şey yazın..." onkeypress="handleKeyPress(event)">
                        <button class="btn-send" onclick="sendMessage()">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="universe-grid-panel">
                <div class="panel-title" id="grid-title">Tüm Boyutlar & Modlar</div>
                <div class="grid-container" id="grid-container-box"></div>
            </div>
        </div>
    </div>

    <script>
        let currentLang = 'TR';
        let currentSelectedId = 'egypt';

        const localization = {
            TR: {
                appTitle: 'AI<span>TimeWalk</span>',
                senderTitle: 'ZAMAN REHBERİ',
                welcomeMsg: 'Zaman ve boyut portalına hoş geldin yolcu. Gitmek istediğin dönemi veya paralel evreni seç, gerisini kuantum yapay zekâ motoruna bırak. Kronoloji kırılmasına hazır mısın?',
                placeholder: 'Zaman çizgisini değiştirecek bir şey yazın...',
                gridTitle: 'Tüm Boyutlar & Modlar',
                premiumLock: 'KİLİTLİ',
                systemPrefix: 'Sistem Odak Modu: '
            },
            EN: {
                appTitle: 'AI<span>TimeWalk</span>',
                senderTitle: 'TIME GUIDE',
                welcomeMsg: 'Welcome to the time and dimension portal, traveler. Select the era or parallel universe you wish to visit, and leave the rest to the quantum AI engine. Ready for a timeline split?',
                placeholder: 'Write something to alter the timeline...',
                gridTitle: 'All Dimensions & Modes',
                premiumLock: 'LOCKED',
                systemPrefix: 'System Focus Mode: '
            }
        };

        const universes = [
            { id: 'egypt', icon: '𓁹', nameTR: 'Antik Mısır Simülasyonu', nameEN: 'Ancient Egypt Sim', descTR: 'Firavunlar dönemi, piramitlerin inşası ve gizemli ritüeller.', descEN: 'The era of pharaohs, pyramid constructions, and mystic rituals.', premium: false },
            { id: 'mythology', icon: '🔱', nameTR: 'Mitolojik Evren', nameEN: 'Mythological Universe', descTR: 'Tanrılar, efsanevi yaratıklar ve epik destanların dünyası.', descEN: 'A world of ancient gods, legendary beasts, and epic sagas.', premium: false },
            { id: 'lucid', icon: '👁️', nameTR: 'Lucid Rüya Kontrolü', nameEN: 'Lucid Dream Control', descTR: 'Bilinçaltının derinlikleri ve bükülebilir rüya evrenleri.', descEN: 'Deep subconscious realms and bendable dreamscapes.', premium: false },
            { id: 'ottoman', icon: '🏹', nameTR: 'Osmanlı İmparatorluğu', nameEN: 'Ottoman Empire', descTR: 'Cihan imparatorluğunun yükselişi, fetihler ve saray sırları.', descEN: 'The rise of a global empire, conquests, and palace secrets.', premium: false },
            { id: 'rome', icon: '🏛️', nameTR: 'Roma İmparatorluğu', nameEN: 'Roman Empire', descTR: 'Gladyatör dövüşleri, senato entrikaları ve Sezar dönemi.', descEN: 'Gladiator matches, senate intrigues, and the age of Caesar.', premium: false },
            { id: 'scifi', icon: '🌌', nameTR: 'Cyberpunk 2099', nameEN: 'Cyberpunk 2099', descTR: 'Neon ışıklı distopik gelecek, yapay zekâ isyanları ve siber uzay.', descEN: 'Neon-lit dystopian future, AI rebellions, and cyberspace.', premium: true },
            { id: 'multiverse', icon: '🌀', nameTR: 'Paralel ve Çoklu Evrenler', nameEN: 'Parallel & Multiverses', descTR: 'Farklı kararlarınızla şekillenmiş sonsuz alternatif hayatlar.', descEN: 'Infinite alternative lives shaped by your different choices.', premium: true }
        ];

        window.onload = function() {
            createStars();
            renderComponents();
        };

        function createStars() {
            const container = document.getElementById('stars-container');
            if(!container) return;
            for (let i = 0; i < 60; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                const size = Math.random() * 2 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
                star.style.setProperty('--delay', `${Math.random() * 4}s`);
                star.style.setProperty('--max-opacity', `${Math.random() * 0.5 + 0.3}`);
                container.appendChild(star);
            }
        }

        function toggleLanguage() {
            currentLang = currentLang === 'TR' ? 'EN' : 'TR';
            document.getElementById('lang-btn').querySelector('span').innerText = currentLang === 'TR' ? 'EN' : 'TR';
            
            document.getElementById('app-title').innerHTML = localization[currentLang].appTitle;
            document.getElementById('sender-title').innerText = localization[currentLang].senderTitle;
            document.getElementById('welcome-msg').innerText = localization[currentLang].welcomeMsg;
            document.getElementById('user-input').placeholder = localization[currentLang].placeholder;
            document.getElementById('grid-title').innerText = localization[currentLang].gridTitle;

            renderComponents();
        }

        function renderComponents() {
            const eraRow = document.getElementById('era-row-container');
            const gridBox = document.getElementById('grid-container-box');
            if(!eraRow || !gridBox) return;

            eraRow.innerHTML = '';
            gridBox.innerHTML = '';

            universes.forEach(uni => {
                const name = currentLang === 'TR' ? uni.nameTR : uni.nameEN;
                const desc = currentLang === 'TR' ? uni.descTR : uni.descEN;
                const activeClass = uni.id === currentSelectedId ? 'active' : '';
                const premiumClass = uni.premium ? 'premium' : '';

                const tab = document.createElement('div');
                tab.className = `era-tab ${activeClass}`;
                tab.innerHTML = `<span>${uni.icon}</span> ${name}`;
                tab.onclick = () => selectUniverse(uni.id);
                eraRow.appendChild(tab);

                const card = document.createElement('div');
                card.className = `universe-card ${activeClass} ${premiumClass}`;
                card.innerHTML = `
                    <div class="lock-badge">${localization[currentLang].premiumLock}</div>
                    <div class="card-header">
                        <span class="card-name">${name}</span>
                        <span class="card-icon">${uni.icon}</span>
                    </div>
                    <div class="card-desc">${desc}</div>
                `;
                card.onclick = () => selectUniverse(uni.id);
                gridBox.appendChild(card);
            });
        }

        function selectUniverse(id) {
            currentSelectedId = id;
            renderComponents();

            const selectedUni = universes.find(u => u.id === id);
            const uniName = currentLang === 'TR' ? selectedUni.nameTR : selectedUni.nameEN;

            const chatBox = document.getElementById('chat-box');
            if(!chatBox) return;
            const sysMsg = document.createElement('div');
            sysMsg.className = 'message system';
            sysMsg.innerHTML = `
                <span class="msg-sender">${localization[currentLang].senderTitle}</span>
                <div class="msg-bubble">
                    <i>${localization[currentLang].systemPrefix} <b>${uniName}</b></i>
                </div>
            `;
            chatBox.appendChild(sysMsg);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('user-input');
            if(!input) return;
            const text = input.value.trim();
            if (!text) return;

            const chatBox = document.getElementById('chat-box');
            if(!chatBox) return;

            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.innerHTML = `
                <span class="msg-sender">${currentLang === 'TR' ? 'YOLCU' : 'TRAVELER'}</span>
                <div class="msg-bubble">${text}</div>
            `;
            chatBox.appendChild(userMsg);
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // Service Worker Kaydı (PWA tetikleyici - hatasız bağımsız dosya yolu)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => console.log('Service Worker kayıt başarılı: ', reg.scope))
                    .catch(err => console.log('Service Worker kaydı başarısız: ', err));
            });
        }
    </script>
</body>
</html>
